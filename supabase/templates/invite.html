<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sei stato invitato su SegretarIA</title>
  </head>
  <body style="margin:0;padding:24px;background:#f5f5f4;font-family:Arial,Helvetica,sans-serif;color:#1c1917;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;">
      <tr>
        <td style="padding:32px;">
          <h1 style="margin:0 0 16px;font-size:20px;">Sei stato invitato su SegretarIA</h1>
          <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">
            Un membro dello studio ti ha invitato a collaborare. Per accettare l'invito, apri il link qui sotto.
          </p>
          <p style="margin:24px 0;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=invite&amp;next={{ .RedirectTo }}"
               style="display:inline-block;padding:12px 20px;background:#1c1917;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;">
              Accetta l'invito
            </a>
          </p>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#57534e;">
            Se non ti aspettavi questo invito puoi ignorare questa email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
